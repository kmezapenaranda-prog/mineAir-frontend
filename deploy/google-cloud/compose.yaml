name: mineair
services:
  api:
    build:
      context: ./.bundle/ml
    restart: unless-stopped
    volumes:
      - mineair-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/estado', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  web:
    build:
      context: ../..
      dockerfile: deploy/google-cloud/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Acceso inicial por túnel SSH/IAP. La API no tiene autenticación propia.
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  mineair-data:
